<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h3>Chat</h3>
      <div id="messages"></div>
      <form id="form">
        <input id="input" placeholder="e.g. spent 250 on lunch" autocomplete="off">
        <button>Send</button>
      </form>
    </div>

    <div class="panel">
      <h3>Recent expenses</h3>
      <div class="table-box">
        <table>
          <thead><tr><th>ID</th><th>Date</th><th>Rs.</th><th>Category</th><th>Note</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
