<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; }
    .wrap { display: flex; gap: 16px; padding: 16px; height: 100vh; }
    .panel { background: white; border-radius: 8px; padding: 16px; flex: 1; display: flex; flex-direction: column; min-height: 0; }
    h3 { margin: 0 0 12px; }
    #messages { flex: 1; overflow-y: auto; }
    .msg { margin: 6px 0; padding: 8px 12px; border-radius: 8px; max-width: 85%; white-space: pre-wrap; }
    .user { background: #dbeafe; margin-left: auto; }
    .bot { background: #eee; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { padding: 10px 16px; border: 0; background: #2563eb; color: white; border-radius: 6px; cursor: pointer; }
    .table-box { overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid #eee; }
    @media (max-width: 700px) { .wrap { flex-direction: column; height: auto; } .panel { height: 60vh; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <h3>Chat</h3>
      <div id="messages"></div>
      <form id="form">
        <input id="input" placeholder="e.g. spent 250 on lunch" autocomplete="off">
        <button>Send</button>
      </form>
    </div>

    <div class="panel">
      <h3>Recent expenses</h3>
      <div class="table-box">
        <table>
          <thead><tr><th>ID</th><th>Date</th><th>Rs.</th><th>Category</th><th>Note</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    }

    async function loadExpenses() {
      const res = await fetch("/expenses");
      const data = await res.json();
      document.getElementById("rows").innerHTML = data.map(e =>
        `<tr><td>${e.id}</td><td>${e.date}</td><td>${e.amount}</td><td>${e.category}</td><td>${e.description}</td></tr>`
      ).join("");
    }

    document.getElementById("form").addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      addMessage(text, "user");
      const thinking = addMessage("...", "bot");
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      });
      const data = await res.json();
      thinking.textContent = data.reply;
      loadExpenses();  // refresh the table after every message
    });

    loadExpenses();
  </script>
</body>
</html>
